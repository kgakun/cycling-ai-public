  const popup = `<b>Long climb #${c.idx}</b><br>${c.start_distance_km.toFixed(1)} - ${c.end_distance_km.toFixed(1)} km<br>Length: ${c.distance_km.toFixed(1)} km<br>Avg grade: ${c.avg_gradient.toFixed(1)}%<br>Max grade: ${c.max_gradient.toFixed(1)}%<br>Gain: ${c.elevation_gain_m.toFixed(0)} m`;

(function () {
  if (window.__cyclingLiveLocationInstalled) return;
  window.__cyclingLiveLocationInstalled = true;

  const panel = document.createElement("div");
  panel.className = "live-location-panel";

  const button = document.createElement("button");
  button.type = "button";
  button.textContent = "現在地";

  const followButton = document.createElement("button");
  followButton.type = "button";
  followButton.textContent = "追従 OFF";

  const status = document.createElement("div");
  status.className = "live-location-status";
  status.textContent = "現在地ボタンを押すと位置情報を表示します。";

  panel.appendChild(button);
  panel.appendChild(followButton);
  panel.appendChild(status);
  document.body.appendChild(panel);

  let watchId = null;
  let follow = false;
  let currentMarker = null;
  let accuracyCircle = null;

  const currentIcon = L.divIcon({
    className: "",
    html: '<div style="width:18px;height:18px;border-radius:50%;background:#1976d2;border:3px solid white;box-shadow:0 0 0 2px #1976d2,0 2px 8px rgba(0,0,0,.35);"></div>',
    iconSize: [24, 24],
    iconAnchor: [12, 12]
  });

  function setStatus(text) {
    status.textContent = text;
  }

  function environmentProblem() {
    if (!window.isSecureContext) {
      return `このページはHTTPSではありません。iPhone Safariの現在地取得はHTTPS配信が必要です。現在のURL: ${location.protocol}`;
    }
    if (!navigator.geolocation) {
      return "このブラウザでは位置情報APIが使えません。Safariの位置情報設定を確認してください。";
    }
    return "";
  }

  const initialProblem = environmentProblem();
  if (initialProblem) {
    setStatus(initialProblem);
  }

  function updatePosition(pos) {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const accuracy = Math.round(pos.coords.accuracy || 0);
    const latLng = [lat, lon];

    if (!currentMarker) {
      currentMarker = L.marker(latLng, { icon: currentIcon, zIndexOffset: 1000 }).addTo(map);
      currentMarker.bindPopup("現在地");
    } else {
      currentMarker.setLatLng(latLng);
    }

    if (!accuracyCircle) {
      accuracyCircle = L.circle(latLng, {
        radius: accuracy,
        color: "#1976d2",
        weight: 1,
        fillColor: "#1976d2",
        fillOpacity: 0.12
      }).addTo(map);
    } else {
      accuracyCircle.setLatLng(latLng);
      accuracyCircle.setRadius(accuracy);
    }

    if (follow) {
      map.setView(latLng, Math.max(map.getZoom(), 15));
    }

    setStatus(`現在地取得中 / 精度 ${accuracy}m`);
  }

  function handleError(err) {
    const message = err && err.message ? err.message : "位置情報を取得できません。";
    setStatus(`現在地を取得できません: ${message}`);
    button.classList.remove("active");
  }

  button.addEventListener("click", function () {
    const problem = environmentProblem();
    if (problem) {
      setStatus(problem);
      return;
    }

    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      button.classList.remove("active");
      button.textContent = "現在地";
      setStatus("現在地表示を停止しました。");
      return;
    }

    watchId = navigator.geolocation.watchPosition(
      updatePosition,
      handleError,
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
    button.classList.add("active");
    button.textContent = "停止";
    setStatus("現在地を取得しています。ブラウザの許可が必要です。");
  });

  followButton.addEventListener("click", function () {
    follow = !follow;
    followButton.classList.toggle("active", follow);
    followButton.textContent = follow ? "追従 ON" : "追従 OFF";
    if (follow && currentMarker) {
      map.setView(currentMarker.getLatLng(), Math.max(map.getZoom(), 15));
    }
  });
})();

</script>
